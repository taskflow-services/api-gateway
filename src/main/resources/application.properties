spring.application.name=api-gateway
server.port=8082

spring.cloud.gateway.server.webmvc.routes[0].id=taskflow
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://TASKFLOW
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/tasks/**

spring.cloud.gateway.server.webmvc.routes[1].id=notification-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/notifications/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.id=notification-service
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.fallbackUri=forward:/fallback/notifications
spring.config.import=optional:configserver:http://localhost:8888
management.endpoints.web.exposure.include=busrefresh
# Bus brings in Spring Cloud Function, which makes the gateway add a catch-all /{path} function route that shadows @RestControllers
spring.cloud.gateway.server.webmvc.function.enabled=false
resilience4j.circuitbreaker.instances.notification-service.sliding-window-size=4
resilience4j.circuitbreaker.instances.notification-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notification-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.notification-service.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.notification-service.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.notification-service.slow-call-rate-threshold=50
